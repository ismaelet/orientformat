<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title></title>

	<style>
		* {
			margin: 0;
		}

		h1,
		h2,
		h3 {
			margin-bottom: 16px;
			text-align: center;
			font-family: Open Sans;
			font-weight: 400;
		}

		h1 {
			font-size: 36px;
		}

		h2 {
			font-size: 25px;
		}

		h3 {
			font-size: 18px;
		}

		p {
			font-family: Open Sans;
			font-size: 15px;
			line-height: 1.8;
		}

		.no-link,
		.no-link a {
			color: inherit !important;
			text-decoration: none !important;
		}
	</style>
</head>

<body style="margin: 0" bgcolor="#f4f5ff">
	<table width="100%" bgcolor="#f4f5ff">
		<tr>
			<td style="padding: 32px">
				<center>
					<table style="width: 100%; max-width: 650px">
						<tr>
							<td style="padding-bottom: 16px">
								<center>
									<img style="max-width: 40%" src="{{ logo }}" alt="" />
								</center>
							</td>
						</tr>
						<tr>
							<td>
								<table width="100%" style="padding: 48px 48px" bgcolor="#fff">
									<tr>
										<td>{{ content }}</td>
									</tr>
								</table>
							</td>
						</tr>
						<tr>
							<td>
								<table style="width: 100%; padding: 20px 0">
									{{ instagram-link }} {{ facebook-link }}
								</table>
							</td>
						</tr>
					</table>
				</center>
			</td>
		</tr>
	</table>
</body>

</html>
