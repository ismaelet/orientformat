name: orientformat
services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: base
    configs:
      - source: caddy_config
        target: /etc/frankenphp/Caddyfile
      - source: php_config
        target: /usr/local/etc/php/conf.d/app.ini
    volumes:
      - ./app:/var/www/html
    working_dir: /var/www/html
    environment:
      APP_NAME: "OrientFormat"
      APP_ENV: local
      APP_DEBUG: true
      APP_LOCALE: it
      APP_FALLBACK_LOCALE: en

      APP_URL: http://localhost:8010
      ASSET_URL: http://localhost:8010
      APP_SUBDOMAIN: ""
      APP_KEY: ${APP_KEY}

      SESSION_DRIVER: file

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: project_database
      DB_USERNAME: root
      DB_PASSWORD: rootpassword

      MAIL_MAILER: smtp
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: 25
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM_ADDRESS: no-reply@iprase.tn.it
      MAIL_FROM_NAME: Orientamento Formativo

      # Services
      SENTRY_LARAVEL_DSN: null
      SENTRY_TRACES_SAMPLE_RATE: 0
    ports:
      - 8010:80
    depends_on:
      db:
        condition: service_healthy

  vite:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: deps
    volumes:
      - ./app:/var/www/html
      - node_modules:/var/www/html/node_modules
      - pnpm_store:/pnpm/store
    environment:
      PNPM_STORE_DIR: /pnpm/store
    command: /bin/bash -c "pnpm install --frozen-lockfile && pnpm run dev -- --host 0.0.0.0"
    ports:
      - 5173:5173

  db:
    image: mysql:5.7.40
    volumes:
      - "database:/var/lib/mysql"
    environment:
      MYSQL_DATABASE: project_database
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - 3306:3306
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  database:
  node_modules:
  pnpm_store:

configs:
  caddy_config:
    file: ./docker/app/Caddyfile
  php_config:
    file: ./docker/app/app.ini
