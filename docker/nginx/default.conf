server {
    listen 80;
    listen [::]:80;
    server_name iprase.tn.it;
    root /var/www/html/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;

    charset utf-8;

	location = /orientamento/livewire/livewire.js {
		expires off;
		try_files $uri $uri/ /orientamento/index.php?$query_string;
	}

	location /orientamento {
		alias /var/www/html/public;
        try_files $uri $uri/ @nested;

		location ~ \.php$ {
			fastcgi_pass app:9000;
			fastcgi_param SCRIPT_FILENAME $request_filename;
			include fastcgi_params;
			fastcgi_hide_header X-Powered-By;
		}
	}

	location @nested {
		rewrite /orientamento/(.*)$ /orientamento/index.php?/$1 last;
	}

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /orientamento/index.php;

    location ~ /\.(?!well-known).* {
        deny all;
    }
}